<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Marine electronics helm integration blueprint</title>
  <desc id="desc">A front-view boat helm showing a chartplotter, autopilot control, VHF radio, switches and helm wheel, with protected power, NMEA data, radio frequency and transducer signal paths.</desc>
  <defs>
    <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#59dfea" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minorGrid)"/>
      <path d="M100 0H0V100" fill="none" stroke="#59dfea" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#6df7f0"/></marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d8fbff}
    .micro{font-size:11px;letter-spacing:1.4px;fill:#7cc7d0}.label{font-size:14px;font-weight:700;letter-spacing:1px}.title{font-size:20px;font-weight:800;letter-spacing:2px;fill:#6df7f0}
    .line{fill:none;stroke:#d8fbff;stroke-width:2;vector-effect:non-scaling-stroke}.muted{fill:none;stroke:#7cc7d0;stroke-opacity:.55;stroke-width:1.3;vector-effect:non-scaling-stroke}
    .box{fill:#071d36;fill-opacity:.86;stroke:#9feff3;stroke-opacity:.72;stroke-width:1.7;vector-effect:non-scaling-stroke}
    .console{fill:#071d36;fill-opacity:.64;stroke:#d8fbff;stroke-opacity:.7;stroke-width:2;vector-effect:non-scaling-stroke}
    .power{fill:none;stroke:#ffc56e;stroke-width:3;vector-effect:non-scaling-stroke}.data{fill:none;stroke:#6df7f0;stroke-width:3;vector-effect:non-scaling-stroke}.rf{fill:none;stroke:#f7f0da;stroke-width:3;vector-effect:non-scaling-stroke}.sonar{fill:none;stroke:#bf9bff;stroke-width:3;vector-effect:non-scaling-stroke}
    .flow{stroke-dasharray:8 17;animation:flow 2.2s linear infinite}.pulse{fill:#b8ff78;stroke:#071d36;stroke-width:3;filter:url(#glow)}
    .tag{fill:#092842;stroke:#6df7f0;stroke-opacity:.45}.dim{fill:none;stroke:#6df7f0;stroke-opacity:.55;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow);vector-effect:non-scaling-stroke}
    @keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>

  <rect width="960" height="680" rx="10" fill="#071d36"/><rect width="960" height="680" rx="10" fill="url(#majorGrid)"/>
  <path d="M24 64V24H64M896 24h40v40M24 616v40h40M896 656h40v-40" class="muted"/>
  <text x="42" y="54" class="title">ZME / HELM CONTROL PANEL</text><text x="918" y="54" text-anchor="end" class="micro">DWG 02 · REV A</text><path d="M42 72H918" class="muted"/>

  <!-- helm console outline -->
  <path d="M170 154Q170 120 204 120H716Q750 120 750 154L808 546H112Z" class="console"/>
  <text x="134" y="143" class="micro">FRONT ELEVATION</text>

  <!-- MFD -->
  <g>
    <rect x="208" y="170" width="326" height="218" rx="14" class="box"/>
    <rect x="230" y="193" width="282" height="172" rx="5" class="muted"/>
    <path d="M246 330c40-68 86 10 130-49s77 7 121-69" class="data"/>
    <path d="M246 227h98M246 245h65M459 218v105M444 302l15 21 19-27" class="muted"/>
    <circle cx="422" cy="270" r="9" class="pulse"/>
    <text x="371" y="410" text-anchor="middle" class="label">MULTIFUNCTION DISPLAY</text>
  </g>

  <!-- autopilot control -->
  <g>
    <rect x="566" y="170" width="112" height="98" rx="10" class="box"/>
    <rect x="586" y="190" width="72" height="34" rx="4" class="muted"/>
    <text x="622" y="214" text-anchor="middle" class="label">AUTO</text>
    <circle cx="594" cy="244" r="10" class="muted"/><circle cx="622" cy="244" r="10" class="muted"/><circle cx="650" cy="244" r="10" class="muted"/>
    <text x="622" y="291" text-anchor="middle" class="micro">AUTOPILOT</text>
  </g>

  <!-- VHF -->
  <g>
    <rect x="566" y="310" width="176" height="78" rx="10" class="box"/>
    <rect x="584" y="328" width="72" height="40" rx="4" class="muted"/>
    <text x="620" y="357" text-anchor="middle" class="title">16</text>
    <circle cx="688" cy="349" r="22" class="muted"/>
    <text x="654" y="410" text-anchor="middle" class="label">VHF / DSC</text>
  </g>

  <!-- switch panel -->
  <g>
    <rect x="208" y="447" width="326" height="64" rx="8" class="box"/>
    <g class="muted">
      <rect x="230" y="462" width="31" height="33" rx="3"/><rect x="274" y="462" width="31" height="33" rx="3"/><rect x="318" y="462" width="31" height="33" rx="3"/><rect x="362" y="462" width="31" height="33" rx="3"/><rect x="406" y="462" width="31" height="33" rx="3"/><rect x="450" y="462" width="31" height="33" rx="3"/><rect x="494" y="462" width="18" height="33" rx="3"/>
    </g>
    <text x="371" y="535" text-anchor="middle" class="micro">LABELED BRANCH SWITCHING / PROTECTION</text>
  </g>

  <!-- wheel -->
  <g class="muted">
    <circle cx="654" cy="478" r="72"/><circle cx="654" cy="478" r="17"/>
    <path d="M654 406v55M654 495v55M582 478h55M671 478h55M603 427l39 39M666 490l39 39M705 427l-39 39M642 490l-39 39"/>
  </g>
  <text x="654" y="575" text-anchor="middle" class="label">HELM CONTROL</text>

  <!-- system paths -->
  <g>
    <path d="M82 604V478H208" class="power"/>
    <path d="M82 604V142H188V170M188 142H554V170M554 142H770V349H742" class="power flow"/>
    <path d="M278 604V426H371V388M371 426H622V268M371 426H654V388" class="data flow"/>
    <path d="M742 349H838V170" class="rf flow"/>
    <path d="M704 604V580H478V388" class="sonar flow"/>
  </g>

  <!-- source labels -->
  <g>
    <rect x="42" y="604" width="166" height="36" rx="4" class="tag"/><text x="125" y="627" text-anchor="middle" class="micro" fill="#ffc56e">PROTECTED 12 VDC</text>
    <rect x="220" y="604" width="150" height="36" rx="4" class="tag"/><text x="295" y="627" text-anchor="middle" class="micro">NMEA DATA</text>
    <rect x="382" y="604" width="174" height="36" rx="4" class="tag"/><text x="469" y="627" text-anchor="middle" class="micro">50 Ω RF / ANTENNA</text>
    <rect x="568" y="604" width="174" height="36" rx="4" class="tag"/><text x="655" y="627" text-anchor="middle" class="micro" fill="#bf9bff">TRANSDUCER SIGNAL</text>
    <rect x="754" y="604" width="164" height="36" rx="4" class="tag"/><text x="836" y="627" text-anchor="middle" class="micro">COMMISSIONED</text>
  </g>

  <!-- quality callouts -->
  <path d="M155 100H758" class="dim"/><text x="456" y="94" text-anchor="middle" class="micro">CUTOUTS · CLEARANCE · SERVICE LOOPS · VENTILATION</text>
  <g transform="translate(838 90)"><path d="M0 80V0" class="line"/><path d="M-21 30Q0 9 21 30M-35 50Q0 16 35 50" class="data"/><text x="0" y="-10" text-anchor="middle" class="micro">VHF ANTENNA</text></g>
  <g transform="translate(772 420)"><rect width="146" height="118" rx="7" class="box"/><text x="15" y="27" class="label">BEHIND PANEL</text><path d="M15 40H131" class="muted"/><text x="15" y="61" class="micro">✓ FUSED</text><text x="15" y="82" class="micro">✓ ROUTED</text><text x="15" y="103" class="micro">✓ LABELED</text></g>
</svg>
