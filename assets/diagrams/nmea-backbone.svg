<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">NMEA 2000 backbone blueprint</title>
  <desc id="desc">A properly laid out NMEA 2000 network with one powered backbone, two 120 ohm end terminators, T connectors, and short drops to marine electronics devices.</desc>
  <defs>
    <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#59dfea" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minorGrid)"/>
      <path d="M100 0H0V100" fill="none" stroke="#59dfea" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10Z" fill="#6df7f0"/>
    </marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d8fbff}
    .micro{font-size:11px;letter-spacing:1.5px;fill:#7cc7d0}
    .label{font-size:14px;font-weight:700;letter-spacing:1.1px}
    .title{font-size:20px;font-weight:800;letter-spacing:2px;fill:#6df7f0}
    .line{fill:none;stroke:#d8fbff;stroke-width:2;vector-effect:non-scaling-stroke}
    .muted{fill:none;stroke:#7cc7d0;stroke-opacity:.55;stroke-width:1.3;vector-effect:non-scaling-stroke}
    .data{fill:none;stroke:#6df7f0;stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke}
    .power{fill:none;stroke:#ffc56e;stroke-width:3;vector-effect:non-scaling-stroke}
    .box{fill:#071d36;fill-opacity:.82;stroke:#9feff3;stroke-opacity:.7;stroke-width:1.7;vector-effect:non-scaling-stroke}
    .node{fill:#071d36;stroke:#6df7f0;stroke-width:3;vector-effect:non-scaling-stroke}
    .dimension{fill:none;stroke:#6df7f0;stroke-opacity:.55;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow);vector-effect:non-scaling-stroke}
    .signal{fill:#b8ff78;stroke:#071d36;stroke-width:3;filter:url(#glow)}
    .flow{fill:none;stroke:#b8ff78;stroke-width:2.5;stroke-dasharray:8 18;animation:flow 2.2s linear infinite;vector-effect:non-scaling-stroke}
    @keyframes flow{to{stroke-dashoffset:-104}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>

  <rect width="960" height="680" rx="10" fill="#071d36"/>
  <rect width="960" height="680" rx="10" fill="url(#majorGrid)"/>
  <path d="M24 64V24H64M896 24h40v40M24 616v40h40M896 656h40v-40" class="muted"/>

  <text x="42" y="54" class="title">ZME / NMEA 2000 BACKBONE</text>
  <text x="918" y="54" text-anchor="end" class="micro">DWG 01 · REV A</text>
  <path d="M42 72H918" class="muted"/>

  <!-- correctly terminated backbone -->
  <path d="M132 342H824" class="data"/>
  <path d="M132 342H824" class="flow"/>
  <text x="478" y="322" text-anchor="middle" class="label">NMEA 2000 BACKBONE / TRUNK</text>

  <!-- end terminators -->
  <g>
    <rect x="84" y="309" width="48" height="66" rx="8" class="box"/>
    <path d="M98 325l20 34M118 325l-20 34" class="line"/>
    <text x="108" y="296" text-anchor="middle" class="label">120 Ω</text>
    <text x="108" y="398" text-anchor="middle" class="micro">END TERMINATOR</text>
  </g>
  <g>
    <rect x="824" y="309" width="48" height="66" rx="8" class="box"/>
    <path d="M838 325l20 34M858 325l-20 34" class="line"/>
    <text x="848" y="296" text-anchor="middle" class="label">120 Ω</text>
    <text x="848" y="398" text-anchor="middle" class="micro">END TERMINATOR</text>
  </g>

  <!-- T connectors and device drops -->
  <g>
    <circle cx="238" cy="342" r="13" class="node"/>
    <path d="M238 329V210" class="line"/>
    <rect x="164" y="116" width="148" height="94" rx="8" class="box"/>
    <rect x="184" y="136" width="108" height="52" rx="3" class="muted"/>
    <path d="M194 172c22-28 45 17 66-12s22-2 27-13" class="line"/>
    <text x="238" y="101" text-anchor="middle" class="label">MULTIFUNCTION DISPLAY</text>
    <text x="238" y="229" text-anchor="middle" class="micro">DEVICE DROP</text>
  </g>

  <g>
    <circle cx="360" cy="342" r="13" class="node"/>
    <path d="M360 355V472" class="line"/>
    <circle cx="360" cy="522" r="50" class="box"/>
    <path d="M360 488v68M326 522h68M340 502l40 40M380 502l-40 40" class="muted"/>
    <text x="360" y="594" text-anchor="middle" class="label">HEADING / GNSS SENSOR</text>
  </g>

  <!-- power insertion tee -->
  <g>
    <circle cx="478" cy="342" r="13" class="node"/>
    <path d="M478 355V445" class="power"/>
    <rect x="416" y="445" width="124" height="72" rx="8" class="box"/>
    <path d="M435 481h16m14 0h28m14 0h16M451 470v22M507 470v22" class="power"/>
    <text x="478" y="540" text-anchor="middle" class="label" fill="#ffc56e">FUSED 12 VDC</text>
    <text x="478" y="560" text-anchor="middle" class="micro">ONE CONTROLLED POWER FEED</text>
  </g>

  <g>
    <circle cx="596" cy="342" r="13" class="node"/>
    <path d="M596 329V210" class="line"/>
    <rect x="528" y="130" width="136" height="80" rx="8" class="box"/>
    <path d="M552 153h88M552 170h88M552 187h58" class="muted"/>
    <text x="596" y="114" text-anchor="middle" class="label">ENGINE GATEWAY</text>
  </g>

  <g>
    <circle cx="714" cy="342" r="13" class="node"/>
    <path d="M714 355V470" class="line"/>
    <rect x="646" y="470" width="136" height="80" rx="8" class="box"/>
    <path d="M671 510q43-42 86 0M714 487v45" class="muted"/>
    <text x="714" y="574" text-anchor="middle" class="label">DEPTH / WIND DATA</text>
  </g>

  <!-- dimensions and diagnostic note -->
  <path d="M132 424H824" class="dimension"/>
  <text x="478" y="447" text-anchor="middle" class="micro">BACKBONE EXTENT · DEVICES CONNECT ONLY THROUGH T-CONNECTORS</text>
  <rect x="42" y="570" width="205" height="70" rx="7" class="box"/>
  <text x="60" y="596" class="micro">POWER OFF RESISTANCE</text>
  <text x="60" y="626" class="title">≈ 60 Ω</text>
  <circle cx="132" cy="342" r="7" class="signal"/>

  <g transform="translate(676 610)">
    <rect width="242" height="30" class="box"/>
    <text x="12" y="20" class="micro">2 × 120 Ω · SHORT DROPS</text>
  </g>
</svg>
