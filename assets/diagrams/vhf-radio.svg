<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Marine VHF radio and FCC inspection blueprint</title>
  <desc id="desc">A marine VHF DSC radio on channel 16 connected to protected power, GPS position data, a properly routed 50 ohm coaxial cable and VHF antenna, with inspection checkpoints.</desc>
  <defs>
    <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#59dfea" stroke-opacity=".07" stroke-width="1"/></pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#minorGrid)"/><path d="M100 0H0V100" fill="none" stroke="#59dfea" stroke-opacity=".13" stroke-width="1"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d8fbff}.micro{font-size:11px;letter-spacing:1.4px;fill:#7cc7d0}.label{font-size:14px;font-weight:700;letter-spacing:1px}.title{font-size:20px;font-weight:800;letter-spacing:2px;fill:#6df7f0}
    .line{fill:none;stroke:#d8fbff;stroke-width:2;vector-effect:non-scaling-stroke}.muted{fill:none;stroke:#7cc7d0;stroke-opacity:.55;stroke-width:1.3;vector-effect:non-scaling-stroke}.box{fill:#071d36;fill-opacity:.86;stroke:#9feff3;stroke-opacity:.72;stroke-width:1.7;vector-effect:non-scaling-stroke}
    .power{fill:none;stroke:#ffc56e;stroke-width:3;vector-effect:non-scaling-stroke}.data{fill:none;stroke:#6df7f0;stroke-width:3;vector-effect:non-scaling-stroke}.rf{fill:none;stroke:#f7f0da;stroke-width:4;vector-effect:non-scaling-stroke}.flow{stroke-dasharray:8 18;animation:flow 2s linear infinite}.signal{fill:#b8ff78;stroke:#071d36;stroke-width:3;filter:url(#glow)}
    .danger{fill:#ff7367;stroke:#ff9a92}.check{fill:none;stroke:#b8ff78;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.wave{fill:none;stroke:#6df7f0;stroke-width:1.8;stroke-opacity:.8;animation:pulse 2.6s ease-in-out infinite;transform-origin:760px 226px}.tag{fill:#092842;stroke:#6df7f0;stroke-opacity:.42}
    @keyframes flow{to{stroke-dashoffset:-104}}@keyframes pulse{50%{stroke-opacity:.25;transform:scale(.95)}}@media(prefers-reduced-motion:reduce){.flow,.wave{animation:none}}
  </style>

  <rect width="960" height="680" rx="10" fill="#071d36"/><rect width="960" height="680" rx="10" fill="url(#majorGrid)"/>
  <path d="M24 64V24H64M896 24h40v40M24 616v40h40M896 656h40v-40" class="muted"/>
  <text x="42" y="54" class="title">ZME / MARINE RADIO + FCC</text><text x="918" y="54" text-anchor="end" class="micro">DWG 03 · REV A</text><path d="M42 72H918" class="muted"/>

  <!-- VHF radio -->
  <g>
    <rect x="74" y="145" width="428" height="304" rx="18" class="box"/>
    <text x="98" y="130" class="label">FIXED-MOUNT VHF / DSC</text>
    <rect x="108" y="184" width="218" height="142" rx="8" class="muted"/>
    <text x="130" y="214" class="micro">CH</text><text x="130" y="295" class="title" style="font-size:88px">16</text>
    <text x="252" y="220" class="label">25 W</text><text x="252" y="250" class="label">GPS ✓</text><text x="252" y="280" class="label">DSC ✓</text><text x="252" y="307" class="micro">MMSI SET</text>
    <circle cx="405" cy="231" r="57" class="muted"/><circle cx="405" cy="231" r="31" class="muted"/>
    <text x="405" y="307" text-anchor="middle" class="micro">VOL / SQ</text>
    <g class="muted"><rect x="108" y="355" width="64" height="42" rx="5"/><rect x="184" y="355" width="64" height="42" rx="5"/><rect x="260" y="355" width="64" height="42" rx="5"/></g>
    <g><rect x="352" y="342" width="116" height="68" rx="9" fill="#351c27" stroke="#ff7367" stroke-width="2"/><text x="410" y="381" text-anchor="middle" class="micro" fill="#ff9a92">DISTRESS</text></g>
  </g>

  <!-- microphone -->
  <path d="M92 390C32 414 43 510 108 500s86 49 35 80" class="muted" stroke-dasharray="5 6"/>
  <g transform="translate(83 526)"><rect width="126" height="92" rx="20" class="box"/><path d="M28 24h70M28 39h70M28 54h70" class="muted"/><circle cx="63" cy="73" r="8" class="signal"/></g>
  <text x="146" y="641" text-anchor="middle" class="micro">PTT MICROPHONE</text>

  <!-- RF chain to antenna -->
  <path d="M502 238H632V385H762V174" class="rf"/>
  <path d="M502 238H632V385H762V174" class="rf flow"/>
  <circle cx="502" cy="238" r="7" class="signal"/>
  <text x="638" y="367" text-anchor="middle" class="label">50 Ω COAX</text>
  <text x="638" y="407" text-anchor="middle" class="micro">ROUTED · SEALED · TESTED</text>

  <!-- antenna -->
  <g>
    <path d="M762 174V100" class="line"/><rect x="745" y="174" width="34" height="44" rx="5" class="box"/>
    <path d="M735 124q27-27 54 0M714 148q48-48 96 0M692 172q70-69 140 0" class="wave"/>
    <text x="762" y="238" text-anchor="middle" class="label">VHF ANTENNA</text><text x="762" y="258" text-anchor="middle" class="micro">MOUNT / FEED / SWR</text>
  </g>

  <!-- inputs -->
  <path d="M272 570V486H322V449" class="power flow"/><rect x="230" y="570" width="130" height="44" rx="5" class="tag"/><text x="295" y="598" text-anchor="middle" class="micro" fill="#ffc56e">FUSED 12 VDC</text>
  <path d="M414 570V486H382V449" class="data flow"/><rect x="366" y="570" width="154" height="44" rx="5" class="tag"/><text x="443" y="590" text-anchor="middle" class="micro">GPS POSITION</text><text x="443" y="605" text-anchor="middle" class="micro">NMEA DATA</text>

  <!-- inspection block -->
  <g transform="translate(592 444)">
    <rect width="326" height="174" rx="10" class="box"/>
    <text x="18" y="31" class="label">SHIP-RADIO CHECKPOINTS</text><text x="298" y="31" text-anchor="end" class="micro">PART 80</text>
    <path d="M18 46H308M18 79H308M18 112H308M18 145H308" class="muted"/>
    <path d="M22 65l7 7 13-17M22 98l7 7 13-17M22 131l7 7 13-17M22 164l7 7 13-17" class="check"/>
    <text x="54" y="68" class="micro">INSTALLATION / POWER</text><text x="54" y="101" class="micro">DSC / GPS / IDENTITY</text><text x="54" y="134" class="micro">COAX / ANTENNA / RF</text><text x="54" y="167" class="micro">REQUIRED RECORDS</text>
  </g>

  <text x="918" y="290" text-anchor="end" class="micro">FCC-LICENSED GROL TECHNICIAN</text>
  <text x="918" y="309" text-anchor="end" class="micro">NON-GMDSS · COVERED VESSELS</text>
</svg>
